<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Зал «Prama» на Виленском</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f4f6;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 30px 25px 35px;
            max-width: 750px;
            width: 100%;
            border: 1px solid rgba(0, 69, 50, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid #E65907;
        }

        .header h1 {
            color: #004532;
            font-weight: 700;
            font-size: 2.0rem;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header h1 span {
            color: #E65907;
        }

        .header p {
            color: #004532;
            font-weight: 400;
            font-size: 1rem;
            margin-top: 5px;
            opacity: 0.8;
        }

        .form-wrapper {
            border-radius: 16px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .form-wrapper iframe {
            display: block;
            width: 100%;
            height: 900px; /* Увеличил высоту, чтобы кнопка точно помещалась */
            border: none;
            overflow: hidden;
            transition: height 0.2s ease;
        }

        /* ======================================== */
        /* АДАПТАЦИЯ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
        /* ======================================== */

        @media (max-width: 600px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .container {
                padding: 20px 16px 25px;
                border-radius: 24px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .form-wrapper iframe {
                height: 800px; /* На телефоне тоже увеличил */
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 15px 10px 20px;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .form-wrapper iframe {
                height: 750px;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 40px 40px 45px;
            }

            .form-wrapper iframe {
                height: 950px; /* На десктопе ещё чуть выше */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Зал <span>«Prama»</span> на Виленском</h1>
            <p>Заполните форму для записи на занятие</p>
        </div>

        <div class="form-wrapper">
            <iframe
                src="https://forms.yandex.ru/u/6a915a3e95add565fc67bc5c?iframe=1"
                frameborder="0"
                name="ya-form-6a915a3e95add565fc67bc5c"
                loading="lazy"
                title="Форма записи в зал Prama"
                scrolling="no">
            </iframe>
        </div>
    </div>

    <script>
        function resizeIframe() {
            const iframe = document.querySelector('.form-wrapper iframe');
            if (iframe) {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.body) {
                        const height = iframeDoc.body.scrollHeight || iframeDoc.documentElement.scrollHeight;
                        if (height > 100) {
                            iframe.style.height = height + 'px';
                        }
                    }
                } catch (e) {
                    // Если доступ запрещен — ничего не делаем, оставляем фиксированную высоту
                }
            }
        }

        window.addEventListener('load', function() {
            setTimeout(resizeIframe, 500);
        });

        window.addEventListener('resize', function() {
            setTimeout(resizeIframe, 300);
        });
    </script>
</body>
</html>
